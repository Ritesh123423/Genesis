services:
  - type: web
    name: genesis-website
    env: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=2048"
      - key: DATABASE_URL
        fromDatabase:
          name: genesis-db
          property: connectionString
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "10"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
    healthCheckPath: /
    autoDeploy: true

databases:
  - name: genesis-db
    databaseName: genesis
    user: genesis
    plan: starter
    region: oregon
